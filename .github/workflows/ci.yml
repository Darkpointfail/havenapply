name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: haven
          POSTGRES_DB: havenapply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haven -d havenapply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      AUTH_SECRET: ci-secret-at-least-16-chars-long
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://haven:haven@localhost:5432/havenapply?schema=public
      STORAGE_DRIVER: minio
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: haven-private
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: "true"
      DOCUMENT_MAX_BYTES: "10485760"
      DOCUMENT_SIGNED_URL_TTL_SECONDS: "60"
      EMAIL_DRIVER: smtp
      EMAIL_FROM: "HavenApply <noreply@havenapply.local>"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      DEFAULT_LOCALE: fr

    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name haven-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              break
            fi
            sleep 1
          done
          docker run --rm --network host minio/mc:RELEASE.2025-04-16T18-13-26Z \
            /bin/sh -c "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/haven-private && mc anonymous set none local/haven-private"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate + seed
        run: npx prisma migrate deploy && npm run db:seed
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + permission tests
        run: npm test
